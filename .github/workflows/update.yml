name: update

# Copies the formula attached to the latest abonur/whatsapp-mcp release.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  whatsapp-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the formula of the latest release
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download --repo abonur/whatsapp-mcp --pattern whatsapp-mcp.rb --dir "$RUNNER_TEMP" --clobber; then
            echo "no release with a formula yet"
            exit 0
          fi
          # Only accept a formula for this project, with pinned checksums.
          f="$RUNNER_TEMP/whatsapp-mcp.rb"
          grep -q '^class WhatsappMcp < Formula' "$f"
          grep -q 'sha256 "[0-9a-f]\{64\}"' "$f"
          if grep -Eo 'url "[^"]+"' "$f" | grep -v '^url "https://github.com/abonur/whatsapp-mcp/releases/download/'; then
            echo "::error::unexpected download URL in the formula"; exit 1
          fi
          ruby -c "$f"
          mkdir -p Formula
          cp "$f" Formula/whatsapp-mcp.rb
          echo "version=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/whatsapp-mcp.rb)" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.download.outputs.version != ''
        run: |
          git add Formula
          if git diff --cached --quiet; then
            echo "already up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "whatsapp-mcp ${{ steps.download.outputs.version }}"
          git push
